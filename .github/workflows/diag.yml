name: Diagnóstico temporal
on:
  push:
    branches: [tmp-diagnostico-ci]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: npm ci
        run: |
          npm -v
          npm ci --no-audit --no-fund > ci.log 2>&1 || { grep -E "npm (error|ERR)" ci.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
