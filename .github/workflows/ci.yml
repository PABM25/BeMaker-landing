name: Verificación

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Revisión de código
        run: npm run lint
      - name: Compilación
        run: npm run build > build.log 2>&1 || { tail -40 build.log | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
